name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests & syntax
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install ffmpeg (used by the media inspection tool)
        run: brew install ffmpeg

      - name: Run checks
        run: npm run check

      - name: Build and verify macOS app bundle
        env:
          APP_BUNDLE_OVERRIDE: ${{ runner.temp }}/LocalGravity-CI.app
          LOCALGRAVITY_ADHOC_SIGNING: '1'
        run: |
          bash scripts/build-app.sh
          plutil -lint "$APP_BUNDLE_OVERRIDE/Contents/Info.plist"
          codesign --verify --deep --strict "$APP_BUNDLE_OVERRIDE"
          test -x "$APP_BUNDLE_OVERRIDE/Contents/MacOS/LocalGravity"